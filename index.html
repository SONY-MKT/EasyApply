<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { 
              console.warn('Ignored attempt to set window.fetch'); 
            },
            configurable: true,
            enumerable: true
          });
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            Object.defineProperty(globalThis, 'fetch', {
              get: function() { return originalFetch; },
              set: function(val) { 
                console.warn('Ignored attempt to set globalThis.fetch'); 
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.error('Error patching fetch:', e);
        }
      })();
    </script>
