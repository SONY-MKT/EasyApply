<div class="p-5 space-y-6">
  <div class="mb-2">
    <h2 class="text-xl text-gray-800">Hello,</h2>
    <h3 class="text-xl font-semibold text-gray-900">Welcome to EASY APPLY</h3>
  </div>

  <div class="bg-red-600 rounded-2xl p-6 text-white relative overflow-hidden shadow-lg shadow-red-600/30">
    <div class="relative z-10">
      <h3 class="text-2xl font-bold mb-1">Fast & Easy Loan</h3>
      <p class="text-red-100 text-sm mb-4">Get approved within 24 hours.</p>
      <button onclick="navigate('apply')" class="bg-white text-red-600 font-bold py-2 px-5 rounded-full text-sm hover:bg-gray-50 transition-colors shadow-sm">
        Apply Now
      </button>
    </div>
    <span class="material-icons-round absolute -right-6 -bottom-6 text-[120px] text-white opacity-10">account_balance</span>
  </div>

  <div class="space-y-3 pb-8">
    <button onclick="navigate('apply')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition-transform active:scale-[0.98]">
      <div class="flex items-center gap-4">
        <div class="p-3 rounded-xl bg-red-50 text-red-600">
          <span class="material-icons-round">edit_document</span>
        </div>
        <div class="text-left">
          <h4 class="font-bold text-gray-900">APPLY LOAN</h4>
          <p class="text-xs text-gray-500 mt-0.5">Quick and easy loan application</p>
        </div>
      </div>
      <span class="material-icons-round text-gray-300">chevron_right</span>
    </button>

    <button onclick="navigate('calculator')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition-transform active:scale-[0.98]">
      <div class="flex items-center gap-4">
        <div class="p-3 rounded-xl bg-red-50 text-red-600">
          <span class="material-icons-round">calculate</span>
        </div>
        <div class="text-left">
          <h4 class="font-bold text-gray-900">LOAN CALCULATOR</h4>
          <p class="text-xs text-gray-500 mt-0.5">Calculate your monthly payment</p>
        </div>
      </div>
      <span class="material-icons-round text-gray-300">chevron_right</span>
    </button>

    <button onclick="navigate('status')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition-transform active:scale-[0.98]">
      <div class="flex items-center gap-4">
        <div class="p-3 rounded-xl bg-yellow-50 text-yellow-500">
          <span class="material-icons-round">assignment</span>
        </div>
        <div class="text-left">
          <h4 class="font-bold text-gray-900">LOAN STATUS</h4>
          <p class="text-xs text-gray-500 mt-0.5">Track your application status</p>
        </div>
      </div>
      <span class="material-icons-round text-gray-300">chevron_right</span>
    </button>

    <button class="w-full bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition-transform active:scale-[0.98]">
      <div class="flex items-center gap-4">
        <div class="p-3 rounded-xl bg-green-50 text-green-500">
          <span class="material-icons-round">card_giftcard</span>
        </div>
        <div class="text-left">
          <h4 class="font-bold text-gray-900">PROMOTIONS</h4>
          <p class="text-xs text-gray-500 mt-0.5">Check out our latest promotions</p>
        </div>
      </div>
      <span class="material-icons-round text-gray-300">chevron_right</span>
    </button>
  </div>
</div>
