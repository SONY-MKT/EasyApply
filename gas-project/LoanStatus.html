<div class="p-5 flex flex-col items-center justify-center min-h-[60vh] text-center">
  <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4 text-gray-400">
    <span class="material-icons-round text-4xl">search_off</span>
  </div>
  <h3 class="text-lg font-bold text-gray-900 mb-2">No Applications Found</h3>
  <p class="text-sm text-gray-500 mb-6">Enter your phone number to check your status.</p>
  
  <div class="w-full max-w-sm">
    <div class="relative flex items-center mb-4">
      <span class="material-icons-round absolute left-4 text-gray-400">phone</span>
      <input type="tel" placeholder="Phone Number" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
    </div>
    <button class="w-full py-4 bg-red-600 text-white font-bold rounded-xl shadow-md" onclick="showToast('Feature coming soon!')">Check Status</button>
  </div>
</div>
