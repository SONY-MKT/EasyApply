<div class="p-5 pb-8 space-y-6">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Loan Amount (USD)</label>
      <input type="number" id="calcAmount" value="5000" oninput="calculateLoan()" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm font-medium">
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Loan Tenure</label>
      <div class="relative">
        <select id="calcTenure" onchange="calculateLoan()" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm font-medium appearance-none">
          <option value="6">6 Months</option>
          <option value="12">12 Months</option>
          <option value="24" selected>24 Months</option>
          <option value="36">36 Months</option>
        </select>
        <span class="material-icons-round absolute right-4 top-3 text-gray-400 pointer-events-none">expand_more</span>
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Interest Rate (% per year)</label>
      <div class="relative">
        <input type="number" id="calcRate" value="12" oninput="calculateLoan()" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm font-medium">
        <span class="absolute right-4 top-3 text-gray-400 font-bold">%</span>
      </div>
    </div>
  </div>

  <div class="mt-8 border border-red-100 rounded-2xl overflow-hidden shadow-sm bg-white">
    <div class="p-6 text-center border-b border-gray-100">
      <p class="text-red-600 font-bold text-sm tracking-wider uppercase mb-2">Monthly Payment</p>
      <p id="calcMonthly" class="text-4xl font-bold text-gray-900">$235.68</p>
    </div>
    <div class="bg-gray-50 p-4 space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-gray-500 font-medium">Total Interest</span>
        <span id="calcTotalInterest" class="font-semibold text-gray-900">$657.12</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500 font-medium">Total Payment</span>
        <span id="calcTotalPayment" class="font-semibold text-gray-900">$5,657.12</span>
      </div>
    </div>
  </div>
</div>
