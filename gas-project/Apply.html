<div class="p-5 pb-8 space-y-6">
  <form id="loanForm" class="space-y-4" onsubmit="handleApplySubmit(event)">
    
    <!-- Step 1: Personal Info -->
    <div id="step1" class="step-container space-y-4">
      <h3 class="text-sm font-bold text-red-600 uppercase tracking-wider mb-2">1. Personal Info</h3>
      
      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">person</span>
        <input type="text" id="fullName" required placeholder="Full Name" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
      </div>

      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">phone</span>
        <input type="tel" id="phone" required placeholder="Phone Number" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
      </div>

      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">calendar_today</span>
        <input type="date" id="dob" required class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm text-gray-600">
      </div>
      
      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">home</span>
        <input type="text" id="address" required placeholder="Full Address" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
      </div>

      <button type="button" onclick="nextStep(2)" class="w-full py-4 bg-red-600 text-white font-bold rounded-xl shadow-md mt-6">NEXT STEP</button>
    </div>

    <!-- Step 2: Loan Details -->
    <div id="step2" class="step-container space-y-4 hidden">
      <h3 class="text-sm font-bold text-red-600 uppercase tracking-wider mb-2">2. Loan Details</h3>
      
      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">work</span>
        <input type="text" id="occupation" required placeholder="Occupation" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
      </div>

      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">attach_money</span>
        <input type="number" id="income" required placeholder="Monthly Income ($)" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
      </div>

      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">account_balance_wallet</span>
        <input type="number" id="loanAmount" required placeholder="Loan Amount ($)" class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm font-semibold">
      </div>
      
      <div class="relative flex items-center">
        <span class="material-icons-round absolute left-4 text-gray-400">schedule</span>
        <select id="loanPeriod" required class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-red-500 outline-none shadow-sm appearance-none">
          <option value="" disabled selected>Select Loan Tenure</option>
          <option value="6">6 Months</option>
          <option value="12">12 Months</option>
          <option value="24">24 Months</option>
          <option value="36">36 Months</option>
        </select>
        <span class="material-icons-round absolute right-4 text-gray-400 pointer-events-none">expand_more</span>
      </div>

      <div class="flex gap-3 mt-6">
        <button type="button" onclick="nextStep(1)" class="w-1/3 py-4 bg-gray-200 text-gray-700 font-bold rounded-xl shadow-sm">BACK</button>
        <button type="button" onclick="nextStep(3)" class="w-2/3 py-4 bg-red-600 text-white font-bold rounded-xl shadow-md">NEXT STEP</button>
      </div>
    </div>

    <!-- Step 3: Documents -->
    <div id="step3" class="step-container space-y-4 hidden">
      <h3 class="text-sm font-bold text-red-600 uppercase tracking-wider mb-2">3. Upload Documents</h3>
      
      <div class="grid grid-cols-2 gap-3">
        <label class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-red-50 shadow-sm transition-colors text-center h-28">
          <span class="material-icons-round text-red-500 text-3xl">badge</span>
          <span class="text-xs font-medium text-gray-600">ID Card (Front)</span>
          <input type="file" id="idFront" accept="image/*" class="hidden" onchange="handleFileSelect(this, 'idFrontPreview')">
          <p id="idFrontPreview" class="text-[10px] text-green-600 w-full mt-1 hidden break-all"></p>
        </label>
        
        <label class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-red-50 shadow-sm transition-colors text-center h-28">
          <span class="material-icons-round text-red-500 text-3xl">badge</span>
          <span class="text-xs font-medium text-gray-600">ID Card (Back)</span>
          <input type="file" id="idBack" accept="image/*" class="hidden" onchange="handleFileSelect(this, 'idBackPreview')">
          <p id="idBackPreview" class="text-[10px] text-green-600 w-full mt-1 hidden break-all"></p>
        </label>

        <label class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-red-50 shadow-sm transition-colors text-center h-28">
          <span class="material-icons-round text-red-500 text-3xl">request_quote</span>
          <span class="text-xs font-medium text-gray-600">Salary Slip</span>
          <input type="file" id="salarySlip" accept="image/*,application/pdf" class="hidden" onchange="handleFileSelect(this, 'salaryPreview')">
          <p id="salaryPreview" class="text-[10px] text-green-600 w-full mt-1 hidden break-all"></p>
        </label>

        <label class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-red-50 shadow-sm transition-colors text-center h-28">
          <span class="material-icons-round text-red-500 text-3xl">face</span>
          <span class="text-xs font-medium text-gray-600">Selfie</span>
          <input type="file" id="selfie" accept="image/*" capture="user" class="hidden" onchange="handleFileSelect(this, 'selfiePreview')">
          <p id="selfiePreview" class="text-[10px] text-green-600 w-full mt-1 hidden break-all"></p>
        </label>
      </div>

      <div class="flex gap-3 mt-6">
        <button type="button" onclick="nextStep(2)" class="w-1/3 py-4 bg-gray-200 text-gray-700 font-bold rounded-xl shadow-sm">BACK</button>
        <button type="submit" class="w-2/3 py-4 bg-red-600 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2">
          <span>SUBMIT</span>
          <span class="material-icons-round text-sm">send</span>
        </button>
      </div>
    </div>
  </form>
</div>
